# CI: format, lint, and test on every push/PR to the long-lived
# branches (Git flow: develop = integration, main = releases).
#
# Hardware-dependent tests (NVENC, uinput, live compositor) are
# #[ignore]d and do not run here — a green suite is not hardware
# verification (see AGENTS.md).
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      # Persist the Nix store across runs: without this every job
      # re-downloads the whole dev-shell closure (toolchain, ffmpeg, …)
      # from cache.nixos.org — several minutes before any step runs.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Persist cargo deps + build artifacts so clippy/test only
      # recompile the crates that actually changed.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt
        run: nix develop -c cargo fmt --check

      - name: cargo clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -W clippy::pedantic

      # nextest over cargo test for process-per-test isolation (a native
      # crash in one ffmpeg-adjacent test can't mask the rest of the suite)
      # despite being ~1s slower on this suite of many tiny tests.
      - name: cargo nextest
        run: nix develop -c cargo nextest run --workspace
